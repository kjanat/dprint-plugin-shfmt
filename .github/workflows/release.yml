name: release

on:
  push: { tags: ["[0-9]+.[0-9]+.[0-9]+*"] }
  workflow_dispatch:

permissions: { contents: write }

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - name: Setup mise and install tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with: { install: true }

      - name: Run tests
        run: mise run test

      - name: Resolve shfmt engine version
        run: |
          version="$(go list -m -f '{{.Version}}' mvdan.cc/sh/v3)"
          echo "SHFMT_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Publish release
        run: mise run release
        env: { GITHUB_TOKEN: "${{ github.token }}" }
