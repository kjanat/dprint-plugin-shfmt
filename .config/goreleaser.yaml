# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
---
version: 2
project_name: dprint-plugin-shfmt
metadata: { mod_timestamp: "{{ .CommitTimestamp }}" }
builds: [{ id: skip-go-build, skip: true }]
before: { hooks: [go run ./dprint/cmd/build -release] }
release:
  name_template: '{{ .Tag }}{{ with envOrDefault "SHFMT_VERSION" "" }} - mvdan.cc/sh {{ . }}{{ end }}'
  extra_files: [glob: plugin.wasm, glob: .build/schema.json]
checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files: [glob: plugin.wasm, glob: .build/schema.json]
changelog: { use: github-native }
