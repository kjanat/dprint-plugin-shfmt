#:schema https://mise.jdx.dev/schema/mise.json

[tools]
dprint = "0.57.4"
go = "1.27.1"
go-licenses = "2.0.1"
golangci-lint = "2.13.2"
goreleaser = "2.18.1"
tinygo = "0.42.0"

[tool_alias]
go-licenses = "go:github.com/google/go-licenses/v2"
tinygo = "aqua:tinygo-org/tinygo"

[tasks.generate]
description = "Run go generate for code generation"
run = "go generate ./..."

[tasks.lint-fix]
description = "Run golangci-lint with auto-fix"
run = "golangci-lint run --fix ./..."

[tasks.fmt-dprint]
description = "Format files with dprint"
run = "dprint fmt"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.test-integration]
description = "Run integration tests"
run = "go test -tags=integration -count=1 -v ./integration"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.build-wasm]
description = "Build wasm plugin and schema"
run = "go run ./dprint/cmd/build"

[tasks.release-check]
description = "Validate goreleaser configuration"
run = "goreleaser check"

[tasks.release-snapshot]
description = "Build release artifacts with goreleaser (no publish)"
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Create and publish a GitHub release with goreleaser"
run = "goreleaser release --clean"
